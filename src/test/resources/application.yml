spring:
  datasource:
    url: jdbc:h2:mem:bdsystems;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
  mail:
    host: localhost
    port: 1025

security:
  jwt:
    secret: test-secret-that-is-at-least-thirty-two-bytes-long
    issuer: bdsystems-api

app:
  frontend:
    base-url: http://localhost:5173
  mail:
    from: no-reply@bdsystems.test
