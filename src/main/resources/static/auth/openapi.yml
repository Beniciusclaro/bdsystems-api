openapi: 3.0.3

info:
  title: BD Systems API - Authentication
  version: 1.0.0

paths:
  /api/auth/register:
    post:
      tags:
        - Authentication
      summary: Register a new company administrator
      description: Atomically creates a new company, an incomplete active employee without a personal address, and an ADMIN user linked to that employee.
      operationId: register
      security: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRequest'
      responses:
        '201':
          description: User successfully registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Invalid request data
        '409':
          description: User or company already exists

  /api/auth/login:
    post:
      tags:
        - Authentication
      summary: Authenticate user
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Invalid credentials

  /api/auth/logout:
    post:
      tags:
        - Authentication
      summary: Logout user
      operationId: logout
      security:
        - bearerAuth: [ ]
      responses:
        '204':
          description: Logout successful
        '401':
          description: Invalid credentials

  /api/auth/invitations/accept:
    post:
      tags:
        - Authentication
      summary: Accept a user invitation
      description: Consumes a valid one-time invitation, stores the BCrypt password, and activates the user. Invitations expire after 24 hours.
      operationId: acceptUserInvitation
      security: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationAcceptanceRequest'
      responses:
        '204':
          description: Invitation accepted and user activated
        '400':
          description: Invalid or already consumed invitation
        '410':
          description: Invitation exists but has expired

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: user@email.com
        password:
          type: string
          format: password
          example: "123456"

    LoginResponse:
      type: object
      properties:
        token:
          type: string
          example: jwt-token

    UserRequest:
      type: object
      required:
        - name
        - email
        - password
        - company
      properties:
        name:
          type: string
          example: Benicius Alves
        email:
          type: string
          format: email
          example: benicius@example.com
        password:
          type: string
          format: password
          example: MyPassword123!
        company:
          $ref: '#/components/schemas/CompanyRequest'

    AddressRequest:
      type: object
      required:
        - street
        - city
        - state
        - zipcode
      properties:
        street:
          type: string
          example: Rua Example, 123
        city:
          type: string
          example: Porto
        state:
          type: string
          example: Porto
        zipcode:
          type: string
          example: 4000-123

    CompanyRequest:
      type: object
      required:
        - name
        - address
      properties:
        name:
          type: string
          example: BD Systems
        address:
          $ref: '#/components/schemas/AddressRequest'

    UserResponse:
      type: object
      properties:
        token:
          type: string
          example: jwt-token

    InvitationAcceptanceRequest:
      type: object
      required:
        - token
        - password
      properties:
        token:
          type: string
          description: Opaque one-time token received by email.
        password:
          type: string
          format: password
