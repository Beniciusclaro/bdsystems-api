openapi: 3.0.3

info:
  title: BD Systems API - Tool Rentals
  version: 1.0.0

paths:
  /api/tools/{toolId}/rentals:
    get:
      tags:
        - ToolRental
      summary: List rentals for a tool
      description: Returns a paginated list of rental records for a tool belonging to the authenticated company.
      operationId: findToolRentals
      security:
        - bearerAuth: [ ]
      parameters:
        - name: toolId
          in: path
          required: true
          description: Tool UUID.
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 0
            minimum: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 20
            minimum: 1
        - name: sort
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
      responses:
        '200':
          description: A page of rentals for the tool
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolRentalPage'
        '401':
          description: Authentication required
        '404':
          description: Tool not found for the authenticated company
  /api/tool-rentals:
    get:
      tags:
        - ToolRental
      summary: List tool rentals
      description: Returns a paginated list of rental records belonging to the authenticated company.
      operationId: findAllToolRentals
      security:
        - bearerAuth: [ ]
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 0
            minimum: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 20
            minimum: 1
        - name: sort
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
      responses:
        '200':
          description: A page of rentals for the authenticated company
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolRentalPage'
        '401':
          description: Authentication required
    post:
      tags:
        - ToolRental
      summary: Create a tool rental
      description: Creates a rental record for an active tool and active supplier belonging to the authenticated company.
      operationId: createToolRental
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ToolRentalRequest'
            example:
              toolId: 9f9984b0-08cc-41cb-b33c-d2e53a892b59
              supplierId: 306a4c37-708c-451f-98a6-2d355a266d73
              price: 100.00
              rentalPeriod: WEEK
              rentalStartDate: '2026-01-01'
              rentalEndDate: '2026-01-07'
      responses:
        '201':
          description: Tool rental successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolRentalResponse'
        '400':
          description: Invalid price, period, or rental dates
        '401':
          description: Authentication required
        '404':
          description: Active tool or supplier not found for the authenticated company
  /api/tool-rentals/{id}:
    get:
      tags:
        - ToolRental
      summary: Get a tool rental
      description: Returns a rental record if it belongs to the authenticated company.
      operationId: findToolRentalById
      security:
        - bearerAuth: [ ]
      parameters:
        - name: id
          in: path
          required: true
          description: Tool rental UUID.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Tool rental details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolRentalResponse'
        '401':
          description: Authentication required
        '404':
          description: Tool rental not found for the authenticated company
    put:
      tags:
        - ToolRental
      summary: Update a tool rental
      description: Replaces a rental record's tool, supplier, price, period, and dates. Tool and supplier must be active and belong to the authenticated company.
      operationId: updateToolRental
      security:
        - bearerAuth: [ ]
      parameters:
        - name: id
          in: path
          required: true
          description: Tool rental UUID.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ToolRentalRequest'
      responses:
        '200':
          description: Tool rental successfully updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolRentalResponse'
        '400':
          description: Invalid price, period, or rental dates
        '401':
          description: Authentication required
        '404':
          description: Rental, active tool, or active supplier not found for the authenticated company
    delete:
      tags:
        - ToolRental
      summary: Delete a tool rental
      description: Deletes a rental record belonging to the authenticated company.
      operationId: deleteToolRental
      security:
        - bearerAuth: [ ]
      parameters:
        - name: id
          in: path
          required: true
          description: Tool rental UUID.
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Tool rental successfully deleted
        '401':
          description: Authentication required
        '404':
          description: Tool rental not found for the authenticated company

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ToolRentalRequest:
      type: object
      required:
        - toolId
        - supplierId
        - price
        - rentalPeriod
      properties:
        toolId:
          type: string
          format: uuid
        supplierId:
          type: string
          format: uuid
        price:
          type: number
          minimum: 0
          example: 100.00
        rentalPeriod:
          type: string
          enum:
            - HOUR
            - DAY
            - WEEK
            - MONTH
        rentalStartDate:
          type: string
          format: date
          nullable: true
        rentalEndDate:
          type: string
          format: date
          nullable: true

    ToolRentalResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        companyId:
          type: string
          format: uuid
        toolId:
          type: string
          format: uuid
        supplierId:
          type: string
          format: uuid
        price:
          type: number
        rentalPeriod:
          type: string
          enum:
            - HOUR
            - DAY
            - WEEK
            - MONTH
        rentalStartDate:
          type: string
          format: date
          nullable: true
        rentalEndDate:
          type: string
          format: date
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
          nullable: true

    ToolRentalPage:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/ToolRentalResponse'
        page:
          $ref: '#/components/schemas/PageMetadata'

    PageMetadata:
      type: object
      properties:
        size:
          type: integer
          format: int32
        number:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
