openapi: 3.0.3

info:
  title: BD Systems API
  description: API para gerenciamento de empresas, obras e máquinas.
  version: 1.0.0

tags:
  - name: Authentication
    description: Cadastro e autenticação de usuários
  - name: Employee
    description: Cadastro de funcionários
  - name: Supplier
    description: Cadastro de fornecedores
  - name: Tool
    description: Gestão de ferramentas e equipamentos
  - name: ToolRental
    description: Gestão de alugueres de ferramentas
  - name: Planning
    description: Clientes, obras, composições e orçamentos

paths:
  /api/auth/register:
    $ref: './auth/openapi.yml#/paths/~1api~1auth~1register'
  /api/auth/login:
    $ref: './auth/openapi.yml#/paths/~1api~1auth~1login'
  /api/auth/logout:
    $ref: './auth/openapi.yml#/paths/~1api~1auth~1logout'
  /api/employees:
    $ref: './employee/openapi.yml#/paths/~1api~1employees'
  /api/employees/{id}:
    $ref: './employee/openapi.yml#/paths/~1api~1employees~1{id}'
  /api/suppliers:
    $ref: './supplier/openapi.yml#/paths/~1api~1suppliers'
  /api/suppliers/{id}:
    $ref: './supplier/openapi.yml#/paths/~1api~1suppliers~1{id}'
  /api/tools:
    $ref: './tool/openapi.yml#/paths/~1api~1tools'
  /api/tools/{id}:
    $ref: './tool/openapi.yml#/paths/~1api~1tools~1{id}'
  /api/tools/{id}/activate:
    $ref: './tool/openapi.yml#/paths/~1api~1tools~1{id}~1activate'
  /api/tools/{id}/deactivate:
    $ref: './tool/openapi.yml#/paths/~1api~1tools~1{id}~1deactivate'
  /api/tools/{toolId}/rentals:
    $ref: './tool-rental/openapi.yml#/paths/~1api~1tools~1{toolId}~1rentals'
  /api/tool-rentals:
    $ref: './tool-rental/openapi.yml#/paths/~1api~1tool-rentals'
