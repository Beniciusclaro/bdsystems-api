    $ref: './tool-rental/openapi.yml#/paths/~1api~1tool-rentals~1{id}'

  /api/materials:
    $ref: './material/openapi.yml#/paths/~1api~1materials'
  /api/materials/{id}:
    $ref: './material/openapi.yml#/paths/~1api~1materials~1{id}'
  /api/materials/{id}/status:
    $ref: './material/openapi.yml#/paths/~1api~1materials~1{id}~1status'
  /api/materials/{id}/suppliers:
    $ref: './material/openapi.yml#/paths/~1api~1materials~1{id}~1suppliers'
  /api/materials/{id}/suppliers/{associationId}:
    $ref: './material/openapi.yml#/paths/~1api~1materials~1{id}~1suppliers~1{associationId}'
  /api/material-categories:
    $ref: './material/openapi.yml#/paths/~1api~1material-categories'
  /api/material-categories/{id}:
    $ref: './material/openapi.yml#/paths/~1api~1material-categories~1{id}'
  /api/material-categories/{id}/status:
    $ref: './material/openapi.yml#/paths/~1api~1material-categories~1{id}~1status'
  /api/units-of-measure:
    $ref: './material/openapi.yml#/paths/~1api~1units-of-measure'
  /api/clients:
    $ref: './planning/openapi.yml#/paths/~1api~1clients'
  /api/clients/{id}:
    $ref: './planning/openapi.yml#/paths/~1api~1clients~1{id}'
  /api/projects:
    $ref: './planning/openapi.yml#/paths/~1api~1projects'
  /api/projects/{id}:
    $ref: './planning/openapi.yml#/paths/~1api~1projects~1{id}'
  /api/labor-roles:
    $ref: './planning/openapi.yml#/paths/~1api~1labor-roles'
  /api/compositions:
    $ref: './planning/openapi.yml#/paths/~1api~1compositions'
  /api/compositions/{id}:
    $ref: './planning/openapi.yml#/paths/~1api~1compositions~1{id}'
  /api/budgets:
    $ref: './planning/openapi.yml#/paths/~1api~1budgets'
  /api/budgets/{id}:
    $ref: './planning/openapi.yml#/paths/~1api~1budgets~1{id}'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
