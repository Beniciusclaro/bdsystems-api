openapi: 3.0.3

info:
  title: BD Systems API - Employee
  version: 1.0.0

paths:
  /api/employees:
    get:
      tags:
        - Employee
      summary: List employees
      description: Returns a paginated list of enabled employees for the authenticated company, including incomplete employees created during public registration. Nullable personal, address, and professional fields are returned as null. All filters are optional and can be combined; when multiple filters are supplied, they are combined with AND. Empty position or department values are ignored. Position and department use case-insensitive partial matching.
      operationId: findAllEmployees
      security:
        - bearerAuth: [ ]
      parameters:
        - name: page
          in: query
          description: Zero-based page number.
          required: false
          schema:
            type: integer
            format: int32
            default: 0
            minimum: 0
        - name: size
          in: query
          description: Number of employees per page.
          required: false
          schema:
            type: integer
            format: int32
            default: 20
            minimum: 1
        - name: sort
          in: query
          description: Sort criteria in the format property,direction. May be specified more than once.
          required: false
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
            example:
              - fullName,asc
        - name: status
          in: query
          description: Optional exact employment status filter. Combine with position and/or department using AND.
          required: false
          schema:
            type: string
            enum:
              - ACTIVE
              - INACTIVE
              - TERMINATED
              - LEASED
        - name: position
          in: query
          description: Optional case-insensitive partial match for job title. Empty values are ignored. Combine with status and/or department using AND.
          required: false
          schema:
            type: string
            example: Engineer
        - name: department
          in: query
          description: Optional case-insensitive partial match for department. Empty values are ignored. Combine with status and/or position using AND.
          required: false
          schema:
            type: string
            example: Product
      responses:
        '200':
          description: A page of employees for the authenticated company
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeePage'
        '401':
          description: Authentication required
        '403':
          description: JWT does not contain a valid tenant_id
    post:
      tags:
        - Employee
      summary: Register an employee
      description: Creates an employee linked to the company identified by the authenticated JWT tenant_id claim. When userRole is supplied, also creates an inactive linked user and sends a one-time invitation valid for 24 hours. Omitting userRole preserves employee-only creation.
      operationId: createEmployee
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeeRequest'
            example:
              fullName: Taylor Employee
              email: taylor@example.com
              phoneNumber: "+351900000000"
              documentNumber: "123456789"
              birthDate: "1990-01-15"
              address:
                street: Second Street
                city: Lisbon
                state: Lisbon
                zipCode: "1000-002"
              employeeNumber: EMP-001
              position: Engineer
              department: Product
              admissionDate: "2025-01-10"
              status: ACTIVE
              userRole: USER
      responses:
        '201':
          description: Employee successfully registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeResponse'
        '400':
          description: Invalid request data
        '401':
          description: Authentication required
        '404':
          description: Company not found
        '409':
          description: Employee number or employee/user email already registered
  /api/employees/{id}:
    delete:
      tags:
        - Employee
      summary: Delete an employee
      description: Soft deletes the employee by setting its enable flag to true, if it belongs to the authenticated company and is not linked to an active user.
      operationId: deleteEmployee
      security:
        - bearerAuth: [ ]
      parameters:
        - name: id
          in: path
          required: true
          description: Employee UUID.
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Employee successfully deleted
        '401':
          description: Authentication required
        '403':
          description: JWT does not contain a valid tenant_id
        '404':
          description: Employee not found for the authenticated company
        '409':
          description: Employee is linked to an active user
    put:
      tags:
        - Employee
      summary: Update an employee
      description: Replaces employee details for the authenticated company. Name and email changes are synchronized to a linked user. A linked active user prevents employee deactivation.
      operationId: updateEmployee
      security:
        - bearerAuth: [ ]
      parameters:
        - name: id
          in: path
          required: true
          description: Employee UUID.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeeRequest'
      responses:
        '200':
          description: Employee successfully updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeResponse'
        '400':
          description: Invalid request data
        '401':
          description: Authentication required
        '403':
          description: JWT does not contain a valid tenant_id
        '404':
          description: Employee not found for the authenticated company
        '409':
          description: Employee number or email conflict, or attempted deactivation of an employee linked to an active user

  /api/employees/{id}/user-invitation/resend:
    post:
      tags:
        - Employee
      summary: Resend an employee user invitation
      description: Invalidates any previous unconsumed invitation and sends a new 24-hour invitation. Only an inactive linked user in the authenticated tenant is eligible.
      operationId: resendEmployeeUserInvitation
      security:
        - bearerAuth: [ ]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Invitation replaced and sent
        '401':
          description: Authentication required
        '403':
          description: JWT does not contain a valid tenant_id
        '404':
          description: Employee not found in this tenant or employee has no linked user
        '409':
          description: Linked user is already active

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    EmployeeRequest:
      type: object
      required:
        - fullName
        - email
        - phoneNumber
        - address
        - employeeNumber
        - position
        - department
        - admissionDate
        - status
      properties:
        fullName:
          type: string
          example: Taylor Employee
        email:
          type: string
          format: email
          example: taylor@example.com
        phoneNumber:
          type: string
          nullable: true
          example: "+351900000000"
        documentNumber:
          type: string
          example: "123456789"
        birthDate:
          type: string
          format: date
          nullable: true
          example: "1990-01-15"
        address:
          $ref: '#/components/schemas/AddressRequest'
        employeeNumber:
          type: string
          example: EMP-001
        position:
          type: string
          example: Engineer
        department:
          type: string
          example: Product
        admissionDate:
          type: string
          format: date
          example: "2025-01-10"
        terminationDate:
          type: string
          format: date
          nullable: true
          example: "2026-01-10"
        status:
          type: string
          enum:
            - ACTIVE
            - INACTIVE
            - TERMINATED
            - LEASED
        paymentMethod:
          type: string
          enum:
            - MONTHLY
            - WEEKLY
            - DAILY
            - HOURLY
          nullable: true
        paymentAmount:
          type: number
          nullable: true
        userRole:
          type: string
          enum:
            - USER
            - MANAGER
            - ADMIN
          nullable: true
          description: Optional role for creating a linked inactive user. Ignored by employee updates; role editing is not supported.

    AddressRequest:
      type: object
      required:
        - street
        - city
        - state
        - zipCode
      properties:
        street:
          type: string
          example: Second Street
        city:
          type: string
          example: Lisbon
        state:
          type: string
          example: Lisbon
        zipCode:
          type: string
          example: "1000-002"

    EmployeeResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        fullName:
          type: string
        email:
          type: string
          format: email
        phoneNumber:
          type: string
        documentNumber:
          type: string
        birthDate:
          type: string
          format: date
          nullable: true
        address:
          $ref: '#/components/schemas/AddressResponse'
          nullable: true
        companyId:
          type: string
          format: uuid
        employeeNumber:
          type: string
          nullable: true
        position:
          type: string
          nullable: true
        department:
          type: string
          nullable: true
        admissionDate:
          type: string
          format: date
          nullable: true
        terminationDate:
          type: string
          format: date
          nullable: true
        status:
          type: string
          enum:
            - ACTIVE
            - INACTIVE
            - TERMINATED
            - LEASED
        paymentMethod:
          type: string
          enum:
            - MONTHLY
            - WEEKLY
            - DAILY
            - HOURLY
          nullable: true
        paymentAmount:
          type: number
          nullable: true
        userRole:
          type: string
          enum:
            - USER
            - MANAGER
            - ADMIN
          nullable: true
        userAccessStatus:
          type: string
          enum:
            - NONE
            - PENDING
            - EXPIRED
            - ACTIVE

    EmployeePage:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/EmployeeResponse'
        page:
          type: object
          properties:
            size:
              type: integer
              format: int32
              description: Number of elements requested per page.
            number:
              type: integer
              format: int32
              description: Zero-based page number.
            totalElements:
              type: integer
              format: int64
              description: Total number of matching employees.
            totalPages:
              type: integer
              format: int32
              description: Total number of pages.

    AddressResponse:
      type: object
      properties:
        street:
          type: string
        city:
          type: string
        state:
          type: string
        zipCode:
          type: string
