openapi: 3.0.3

info:
  title: BD Systems API - Employee
  version: 1.0.0

paths:
  /api/employees:
    get:
      tags:
        - Employee
      summary: List employees
      description: Returns a paginated list of employees belonging to the company identified by the authenticated JWT tenant_id claim.
      operationId: findAllEmployees
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          description: Zero-based page number.
          required: false
          schema:
            type: integer
            format: int32
            default: 0
            minimum: 0
        - name: size
          in: query
          description: Number of employees per page.
          required: false
          schema:
            type: integer
            format: int32
            default: 20
            minimum: 1
        - name: sort
          in: query
          description: Sort criteria in the format property,direction. May be specified more than once.
          required: false
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
            example:
              - fullName,asc
      responses:
        '200':
          description: A page of employees for the authenticated company
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeePage'
        '401':
          description: Authentication required
        '403':
          description: JWT does not contain a valid tenant_id
    post:
      tags:
        - Employee
      summary: Register an employee
      description: Creates an employee linked to the company identified by the authenticated JWT tenant_id claim.
      operationId: createEmployee
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeeRequest'
            example:
              fullName: Taylor Employee
              email: taylor@example.com
              phoneNumber: "+351900000000"
              documentNumber: "123456789"
              birthDate: "1990-01-15"
              address:
                street: Second Street
                city: Lisbon
                state: Lisbon
                zipCode: "1000-002"
              employeeNumber: EMP-001
              position: Engineer
              department: Product
              admissionDate: "2025-01-10"
              status: ACTIVE
      responses:
        '201':
          description: Employee successfully registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeResponse'
        '400':
          description: Invalid request data
        '401':
          description: Authentication required
        '404':
          description: Company not found
        '409':
          description: Employee number already registered for this company
  /api/employees/{id}:
    put:
      tags:
        - Employee
      summary: Update an employee
      description: Replaces employee details for the employee identified by id, if it belongs to the company identified by the authenticated JWT tenant_id claim.
      operationId: updateEmployee
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Employee UUID.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeeRequest'
      responses:
        '200':
          description: Employee successfully updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeResponse'
        '400':
          description: Invalid request data
        '401':
          description: Authentication required
        '403':
          description: JWT does not contain a valid tenant_id
        '404':
          description: Employee not found for the authenticated company
        '409':
          description: Employee number already registered for this company

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    EmployeeRequest:
      type: object
      required:
        - fullName
        - email
        - phoneNumber
        - address
        - employeeNumber
        - position
        - department
        - admissionDate
        - status
      properties:
        fullName:
          type: string
          example: Taylor Employee
        email:
          type: string
          format: email
          example: taylor@example.com
        phoneNumber:
          type: string
          example: "+351900000000"
        documentNumber:
          type: string
          example: "123456789"
        birthDate:
          type: string
          format: date
          nullable: true
          example: "1990-01-15"
        address:
          $ref: '#/components/schemas/AddressRequest'
        employeeNumber:
          type: string
          example: EMP-001
        position:
          type: string
          example: Engineer
        department:
          type: string
          example: Product
        admissionDate:
          type: string
          format: date
          example: "2025-01-10"
        terminationDate:
          type: string
          format: date
          nullable: true
          example: "2026-01-10"
        status:
          type: string
          enum:
            - ACTIVE
            - INACTIVE
            - TERMINATED
            - LEASED
        paymentMethod:
          type: string
          enum:
            - MONTHLY
            - WEEKLY
            - DAILY
            - HOURLY
          nullable: true
        paymentAmount:
          type: number
          nullable: true

    AddressRequest:
      type: object
      required:
        - street
        - city
        - state
        - zipCode
      properties:
        street:
          type: string
          example: Second Street
        city:
          type: string
          example: Lisbon
        state:
          type: string
          example: Lisbon
        zipCode:
          type: string
          example: "1000-002"

    EmployeeResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        fullName:
          type: string
        email:
          type: string
          format: email
        phoneNumber:
          type: string
        documentNumber:
          type: string
        birthDate:
          type: string
          format: date
          nullable: true
        address:
          $ref: '#/components/schemas/AddressResponse'
        companyId:
          type: string
          format: uuid
        employeeNumber:
          type: string
        position:
          type: string
        department:
          type: string
        admissionDate:
          type: string
          format: date
        terminationDate:
          type: string
          format: date
          nullable: true
        status:
          type: string
          enum:
            - ACTIVE
            - INACTIVE
            - TERMINATED
            - LEASED
        paymentMethod:
          type: string
          enum:
            - MONTHLY
            - WEEKLY
            - DAILY
            - HOURLY
          nullable: true
        paymentAmount:
          type: number
          nullable: true

    EmployeePage:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/EmployeeResponse'
        pageable:
          $ref: '#/components/schemas/Pageable'
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
        last:
          type: boolean
        size:
          type: integer
          format: int32
        number:
          type: integer
          format: int32
          description: Zero-based page number.
        sort:
          $ref: '#/components/schemas/Sort'
        first:
          type: boolean
        numberOfElements:
          type: integer
          format: int32
        empty:
          type: boolean

    Pageable:
      type: object
      properties:
        pageNumber:
          type: integer
          format: int32
        pageSize:
          type: integer
          format: int32
        offset:
          type: integer
          format: int64
        paged:
          type: boolean
        unpaged:
          type: boolean
        sort:
          $ref: '#/components/schemas/Sort'

    Sort:
      type: object
      properties:
        sorted:
          type: boolean
        unsorted:
          type: boolean
        empty:
          type: boolean

    AddressResponse:
      type: object
      properties:
        street:
          type: string
        city:
          type: string
        state:
          type: string
        zipCode:
          type: string
